winona_etl:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WINONA_DB_HOST') }}"
      port: "{{ env_var('WINONA_DB_PORT') | int }}"
      user: "{{ env_var('WINONA_DB_USER') }}"
      password: "{{ env_var('WINONA_DB_PASSWORD') }}"
      dbname: "{{ env_var('WINONA_DB_NAME') }}"
      schema: public
      threads: 4
