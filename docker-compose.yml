services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: winona
      POSTGRES_PASSWORD: ${WINONA_DB_PASSWORD:-winona}
      POSTGRES_DB: winona_dw
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/.duckdbrc:/root/.duckdbrc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winona -d winona_dw"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      WINONA_DATABASE_URL: postgresql://winona:${WINONA_DB_PASSWORD:-winona}@db:5432/winona_dw
      WINONA_DB_PASSWORD: ${WINONA_DB_PASSWORD:-winona}
    ports:
      - "8000:8000"
    volumes:
      - ./winona_etl:/app/winona_etl
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    build:
      context: web
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      AUTH_URL: http://localhost:3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: winona
      PGPASSWORD: ${WINONA_DB_PASSWORD:-winona}
      PGDATABASE: winona_dw
      SUPERUSER_USERNAME: ${SUPERUSER_USERNAME:-superuser}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-changeme}
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && node scripts/seed-superuser.mjs && npm run dev"

volumes:
  pgdata:
